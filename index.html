<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Malizzia Stats</title>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --accent: #e8ff47;
      --bg: #f7f7f5;
      --surface: #fff;
      --border: rgba(0,0,0,0.08);
      --text: #111;
      --muted: #888;
      --ig: #E1306C;
      --fb: #1877F2;
      --radius: 14px;
    }
    body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    /* HEADER */
    .header {
      background: #111;
      padding: 1.5rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .logo { font-family: 'Bricolage Grotesque', sans-serif; font-size: 22px; font-weight: 800; color: #fff; letter-spacing: -0.5px; }
    .logo span { color: var(--accent); }
    .logo-sub { font-size: 10px; color: rgba(255,255,255,0.35); letter-spacing: 0.1em; text-transform: uppercase; margin-top: 2px; }
    .header-right { display: flex; align-items: center; gap: 1rem; }
    .filter-tabs { display: flex; gap: 4px; background: rgba(255,255,255,0.08); border-radius: 99px; padding: 3px; }
    .filter-tab { font-size: 11px; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; color: rgba(255,255,255,0.4); padding: 5px 12px; border-radius: 99px; cursor: pointer; transition: all 0.15s; border: none; background: transparent; }
    .filter-tab.active { background: var(--accent); color: #111; }

    /* CONTENT */
    .content { padding: 1.5rem 2rem; max-width: 1100px; margin: 0 auto; }
    .section-label { font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.75rem; font-weight: 500; margin-top: 1.75rem; }

    /* KPI GRID */
    .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .kpi-card {
      background: var(--surface);
      border: 0.5px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
      position: relative;
      overflow: hidden;
    }
    .kpi-card.accent { background: var(--accent); }
    .kpi-card.dark { background: #111; }
    .kpi-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 8px; }
    .kpi-card.dark .kpi-label { color: rgba(255,255,255,0.4); }
    .kpi-card.accent .kpi-label { color: rgba(0,0,0,0.5); }
    .kpi-value { font-size: 36px; font-weight: 800; color: var(--text); line-height: 1; font-family: 'Bricolage Grotesque', sans-serif; }
    .kpi-card.dark .kpi-value { color: #fff; }
    .kpi-card.accent .kpi-value { color: #111; }
    .kpi-sub { font-size: 11px; color: var(--muted); margin-top: 6px; }
    .kpi-card.dark .kpi-sub { color: rgba(255,255,255,0.3); }
    .kpi-card.accent .kpi-sub { color: rgba(0,0,0,0.4); }

    /* PLATFORM SPLIT */
    .platform-split { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .platform-card {
      background: var(--surface);
      border: 0.5px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
    }
    .platform-header { display: flex; align-items: center; gap: 8px; margin-bottom: 1rem; }
    .platform-dot { width: 8px; height: 8px; border-radius: 50%; }
    .platform-dot.ig { background: var(--ig); }
    .platform-dot.fb { background: var(--fb); }
    .platform-name-label { font-family: 'Bricolage Grotesque', sans-serif; font-size: 13px; font-weight: 700; }
    .platform-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .platform-stat { background: var(--bg); border-radius: 8px; padding: 10px 12px; }
    .platform-stat-value { font-size: 22px; font-weight: 800; font-family: 'Bricolage Grotesque', sans-serif; }
    .platform-stat-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-top: 2px; }

    /* POST CARDS */
    .posts-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .post-card {
      background: var(--surface);
      border: 0.5px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      transition: transform 0.15s, box-shadow 0.15s;
      cursor: pointer;
    }
    .post-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.08); }
    .post-img {
      width: 100%;
      aspect-ratio: 1;
      background: #efefed;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      position: relative;
      overflow: hidden;
    }
    .post-img img { width: 100%; height: 100%; object-fit: cover; }
    .post-platform-badge {
      position: absolute;
      top: 8px;
      left: 8px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
    }
    .post-platform-badge.ig { background: var(--ig); }
    .post-platform-badge.fb { background: var(--fb); }
    .post-body { padding: 12px; }
    .post-date { font-size: 10px; color: var(--muted); margin-bottom: 4px; }
    .post-message { font-size: 12px; color: var(--text); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 10px; }
    .post-stats { display: flex; gap: 10px; }
    .post-stat { display: flex; align-items: center; gap: 4px; font-size: 11px; color: var(--muted); }
    .post-stat strong { color: var(--text); font-weight: 700; }
    .post-reach-bar { height: 2px; background: #f0f0ee; border-radius: 99px; margin-top: 10px; }
    .post-reach-fill { height: 100%; border-radius: 99px; background: #111; transition: width 0.6s ease; }

    /* TOP POST */
    .top-post-card {
      background: #111;
      border-radius: var(--radius);
      padding: 1.5rem;
      display: flex;
      gap: 1.5rem;
      align-items: flex-start;
    }
    .top-post-img {
      width: 80px;
      height: 80px;
      border-radius: 10px;
      background: #222;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      overflow: hidden;
    }
    .top-post-img img { width: 100%; height: 100%; object-fit: cover; }
    .top-post-badge { background: var(--accent); color: #111; font-size: 9px; font-weight: 700; font-family: 'Bricolage Grotesque', sans-serif; letter-spacing: 0.08em; text-transform: uppercase; border-radius: 99px; padding: 3px 8px; display: inline-block; margin-bottom: 8px; }
    .top-post-message { font-size: 13px; color: rgba(255,255,255,0.7); line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 10px; }
    .top-post-stats { display: flex; gap: 20px; }
    .top-post-stat-value { font-size: 24px; font-weight: 800; color: #fff; font-family: 'Bricolage Grotesque', sans-serif; }
    .top-post-stat-label { font-size: 10px; color: rgba(255,255,255,0.3); text-transform: uppercase; letter-spacing: 0.06em; }

    /* CHART */
    .chart-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 1.25rem; }
    .chart-title { font-family: 'Bricolage Grotesque', sans-serif; font-size: 13px; font-weight: 700; margin-bottom: 1rem; }

    /* LOADING */
    .loading { text-align: center; padding: 4rem; color: var(--muted); font-size: 13px; }
    .spinner { display: inline-block; width: 20px; height: 20px; border: 2px solid #ddd; border-top-color: #111; border-radius: 50%; animation: spin 0.8s linear infinite; margin-right: 8px; vertical-align: middle; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* FOOTER */
    .footer { background: var(--accent); padding: 1rem 2rem; text-align: center; margin-top: 3rem; }
    .footer-text { font-family: 'Bricolage Grotesque', sans-serif; font-size: 13px; font-weight: 700; color: #111; }

    @media (max-width: 768px) {
      .content { padding: 1rem; }
      .kpi-grid { grid-template-columns: repeat(2, 1fr); }
      .platform-split { grid-template-columns: 1fr; }
      .posts-grid { grid-template-columns: repeat(2, 1fr); }
      .top-post-card { flex-direction: column; }
    }
    @media (max-width: 480px) {
      .posts-grid { grid-template-columns: 1fr; }
      .header { flex-direction: column; gap: 1rem; align-items: flex-start; }
    }
  </style>
</head>
<body>

<div class="header">
  <div>
    <div class="logo">Malizzia <span>Stats</span></div>
    <div class="logo-sub">Social Media Dashboard</div>
  </div>
  <div class="header-right">
    <div class="filter-tabs">
      <button class="filter-tab active" onclick="setFilter('all', this)">Todo</button>
      <button class="filter-tab" onclick="setFilter('instagram', this)">Instagram</button>
      <button class="filter-tab" onclick="setFilter('facebook', this)">Facebook</button>
    </div>
  </div>
</div>

<div class="content" id="main-content">
  <div class="loading"><span class="spinner"></span> Cargando datos...</div>
</div>

<div class="footer">
  <div class="footer-text">Malizzia Street Food · Stats</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script>
  const WEBHOOK_URL = 'https://anotherparga.app.n8n.cloud/webhook/malizzia-stats-prueba';

  let currentFilter = 'all';
  let allData = [];

  async function loadData() {
    document.getElementById('main-content').innerHTML = '<div class="loading"><span class="spinner"></span> Cargando datos...</div>';
    try {
      const res = await fetch(WEBHOOK_URL);
      const raw = await res.json();
      // Filtrar filas vacías y normalizar
      allData = (Array.isArray(raw) ? raw : [raw])
        .filter(p => p.post_id && p.platform)
        .map(p => ({
          ...p,
          likes: parseInt(p.likes) || 0,
          comments: parseInt(p.comments) || 0,
          reach: parseInt(p.reach) || 0,
          impressions: parseInt(p.impressions) || 0,
        }));
      renderDashboard();
    } catch(e) {
      document.getElementById('main-content').innerHTML = '<div class="loading">Error cargando datos. Comprueba el webhook.</div>';
    }
  }

  function setFilter(filter, btn) {
    currentFilter = filter;
    document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    renderDashboard();
  }

  function filteredData() {
    if (currentFilter === 'all') return allData;
    return allData.filter(p => p.platform === currentFilter);
  }

  function formatNumber(n) {
    if (!n) return '0';
    if (n >= 1000) return (n/1000).toFixed(1) + 'k';
    return String(n);
  }

  function formatDate(dateStr) {
    const d = new Date(dateStr);
    return d.toLocaleDateString('es-ES', { day: 'numeric', month: 'short', year: 'numeric' });
  }

  function renderDashboard() {
    const data = filteredData();
    const container = document.getElementById('main-content');

    if (!data.length) {
      container.innerHTML = '<div class="loading">Sin datos para esta plataforma</div>';
      return;
    }

    const totalReach = data.reduce((s, p) => s + (parseInt(p.reach) || 0), 0);
    const totalImpressions = data.reduce((s, p) => s + (parseInt(p.impressions) || 0), 0);
    const totalLikes = data.reduce((s, p) => s + (parseInt(p.likes) || 0), 0);
    const totalComments = data.reduce((s, p) => s + (parseInt(p.comments) || 0), 0);
    const totalPosts = data.length;
    const avgEngagement = totalPosts > 0 ? Math.round((totalLikes + totalComments) / totalPosts) : 0;

    const igData = allData.filter(p => p.platform === 'instagram');
    const fbData = allData.filter(p => p.platform === 'facebook');

    const topPost = [...data].sort((a, b) => (parseInt(b.reach) || 0) - (parseInt(a.reach) || 0))[0];
    const maxReach = Math.max(...data.map(p => parseInt(p.reach) || 0));

    // Sort by date desc for display
    const sortedPosts = [...data].sort((a, b) => new Date(b.date) - new Date(a.date));

    container.innerHTML = `
      <div class="section-label">resumen general</div>
      <div class="kpi-grid">
        <div class="kpi-card dark">
          <div class="kpi-label">Alcance total</div>
          <div class="kpi-value">${formatNumber(totalReach)}</div>
          <div class="kpi-sub">${totalPosts} publicaciones</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-label">Impresiones</div>
          <div class="kpi-value">${formatNumber(totalImpressions)}</div>
          <div class="kpi-sub">visualizaciones totales</div>
        </div>
        <div class="kpi-card accent">
          <div class="kpi-label">Me gusta</div>
          <div class="kpi-value">${formatNumber(totalLikes)}</div>
          <div class="kpi-sub">en ${totalPosts} posts</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-label">Eng. medio / post</div>
          <div class="kpi-value">${formatNumber(avgEngagement)}</div>
          <div class="kpi-sub">likes + comentarios</div>
        </div>
      </div>

      ${currentFilter === 'all' ? `
      <div class="section-label">por plataforma</div>
      <div class="platform-split">
        <div class="platform-card">
          <div class="platform-header">
            <div class="platform-dot ig"></div>
            <div class="platform-name-label">Instagram</div>
          </div>
          <div class="platform-stats">
            <div class="platform-stat">
              <div class="platform-stat-value">${formatNumber(igData.reduce((s,p) => s+(parseInt(p.reach)||0), 0))}</div>
              <div class="platform-stat-label">Alcance</div>
            </div>
            <div class="platform-stat">
              <div class="platform-stat-value">${formatNumber(igData.reduce((s,p) => s+(parseInt(p.impressions)||0), 0))}</div>
              <div class="platform-stat-label">Views</div>
            </div>
            <div class="platform-stat">
              <div class="platform-stat-value">${formatNumber(igData.reduce((s,p) => s+(parseInt(p.likes)||0), 0))}</div>
              <div class="platform-stat-label">Likes</div>
            </div>
            <div class="platform-stat">
              <div class="platform-stat-value">${igData.length}</div>
              <div class="platform-stat-label">Posts</div>
            </div>
          </div>
        </div>
        <div class="platform-card">
          <div class="platform-header">
            <div class="platform-dot fb"></div>
            <div class="platform-name-label">Facebook</div>
          </div>
          <div class="platform-stats">
            <div class="platform-stat">
              <div class="platform-stat-value">${formatNumber(fbData.reduce((s,p) => s+(parseInt(p.reach)||0), 0))}</div>
              <div class="platform-stat-label">Alcance</div>
            </div>
            <div class="platform-stat">
              <div class="platform-stat-value">${formatNumber(fbData.reduce((s,p) => s+(parseInt(p.impressions)||0), 0))}</div>
              <div class="platform-stat-label">Impresiones</div>
            </div>
            <div class="platform-stat">
              <div class="platform-stat-value">${formatNumber(fbData.reduce((s,p) => s+(parseInt(p.likes)||0), 0))}</div>
              <div class="platform-stat-label">Likes</div>
            </div>
            <div class="platform-stat">
              <div class="platform-stat-value">${fbData.length}</div>
              <div class="platform-stat-label">Posts</div>
            </div>
          </div>
        </div>
      </div>
      ` : ''}

      <div class="section-label">mejor publicación</div>
      <div class="top-post-card">
        <div class="top-post-img">
          ${topPost.media_url ? `<img src="${topPost.media_url}" alt="post" />` : '🍔'}
        </div>
        <div style="flex:1">
          <div class="top-post-badge">⭐ Top alcance</div>
          <div class="top-post-message">${topPost.message || '(Sin texto)'}</div>
          <div class="top-post-stats">
            <div>
              <div class="top-post-stat-value">${formatNumber(topPost.reach)}</div>
              <div class="top-post-stat-label">Alcance</div>
            </div>
            <div>
              <div class="top-post-stat-value">${formatNumber(topPost.impressions)}</div>
              <div class="top-post-stat-label">Views</div>
            </div>
            <div>
              <div class="top-post-stat-value">${formatNumber(topPost.likes)}</div>
              <div class="top-post-stat-label">Likes</div>
            </div>
            <div>
              <div class="top-post-stat-value">${formatNumber(topPost.comments)}</div>
              <div class="top-post-stat-label">Comentarios</div>
            </div>
          </div>
        </div>
      </div>

      <div class="section-label">todas las publicaciones</div>
      <div class="posts-grid">
        ${sortedPosts.map(post => `
          <a href="${post.permalink}" target="_blank" style="text-decoration:none;color:inherit;">
            <div class="post-card">
              <div class="post-img">
                ${post.media_url ? `<img src="${post.media_url}" alt="post" />` : '🍔'}
                <div class="post-platform-badge ${post.platform === 'instagram' ? 'ig' : 'fb'}">
                  ${post.platform === 'instagram' ? '📷' : '👤'}
                </div>
              </div>
              <div class="post-body">
                <div class="post-date">${formatDate(post.date)}</div>
                <div class="post-message">${post.message || '(Sin texto)'}</div>
                <div class="post-stats">
                  <div class="post-stat">❤️ <strong>${formatNumber(post.likes)}</strong></div>
                  <div class="post-stat">💬 <strong>${formatNumber(post.comments)}</strong></div>
                  <div class="post-stat">👁 <strong>${formatNumber(post.reach)}</strong></div>
                </div>
                <div class="post-reach-bar">
                  <div class="post-reach-fill" style="width:${maxReach > 0 ? Math.round((parseInt(post.reach)||0) / maxReach * 100) : 0}%"></div>
                </div>
              </div>
            </div>
          </a>
        `).join('')}
      </div>
    `;
  }

  // Init
  loadData();
</script>
</body>
</html>
